<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Tech & Med</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            color: #666;
        }

        .emoji {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .quiz-container {
            display: none;
        }

        .quiz-container.active {
            display: block;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 8px;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .question-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #666;
        }

        .category-badge {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option {
            padding: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f9f9f9;
            font-size: 1.05em;
        }

        .option:hover {
            border-color: #667eea;
            background: #f0f0ff;
            transform: translateX(5px);
        }

        .option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .option.correct {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .option.incorrect {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        .button-group {
            display: flex;
            gap: 15px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.05em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            flex: 1;
        }

        .btn-next {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .results-container {
            display: none;
            text-align: center;
        }

        .results-container.active {
            display: block;
        }

        .score-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            margin: 30px auto;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .score-number {
            font-size: 3em;
            font-weight: bold;
        }

        .score-text {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .result-message {
            font-size: 1.5em;
            margin: 30px 0;
            font-weight: bold;
        }

        .result-message.excellent {
            color: #4caf50;
        }

        .result-message.good {
            color: #2196f3;
        }

        .result-message.review {
            color: #ff9800;
        }

        .btn-restart {
            background: #667eea;
            color: white;
            margin-top: 30px;
        }

        .btn-restart:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .start-screen.hidden {
            display: none;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px 50px;
            font-size: 1.2em;
            margin-top: 30px;
        }

        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }

        .feedback.incorrect {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #f44336;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .question-text {
                font-size: 1.1em;
            }

            .score-circle {
                width: 150px;
                height: 150px;
            }

            .score-number {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Tela Inicial -->
        <div class="start-screen">
            <div class="header">
                <div class="emoji">🏥 💻</div>
                <h1>Quiz Tech & Med</h1>
                <p>Teste seus conhecimentos sobre Tecnologia e Medicina</p>
            </div>
            <button class="btn-start" onclick="startQuiz()">Começar Quiz</button>
        </div>

        <!-- Quiz -->
        <div class="quiz-container">
            <div class="progress-bar">
                <div class="progress" id="progressBar"></div>
            </div>

            <div class="question-info">
                <span>Pergunta <span id="currentQuestion">1</span> de <span id="totalQuestions">8</span></span>
                <span class="category-badge" id="categoryBadge">Tecnologia</span>
            </div>

            <div class="question-text" id="questionText"></div>

            <div class="options" id="optionsContainer"></div>

            <div class="feedback" id="feedback"></div>

            <div class="button-group">
                <button class="btn-next" id="nextButton" onclick="nextQuestion()" disabled>
                    Próxima →
                </button>
            </div>
        </div>

        <!-- Resultados -->
        <div class="results-container">
            <div class="header">
                <div class="emoji">📊</div>
                <h1>Resultado Final</h1>
            </div>

            <div class="score-circle">
                <div class="score-number" id="scoreNumber">0</div>
                <div class="score-text">de <span id="totalScore">8</span></div>
            </div>

            <div style="font-size: 1.2em; color: #666; margin-bottom: 20px;">
                <span id="percentage">0</span>% de acertos
            </div>

            <div class="result-message" id="resultMessage"></div>

            <button class="btn-restart" onclick="restartQuiz()">🔄 Fazer Quiz Novamente</button>
        </div>
    </div>

    <script>
        const questionsData = [
            {
                id: 1,
                category: "Tecnologia",
                prompt: "Qual linguagem de programação é a principal escolha para inteligência artificial e ciência de dados?",
                options: ["A) Java", "B) C++", "C) Python", "D) PHP"],
                answer: "C) Python"
            },
            {
                id: 2,
                category: "Tecnologia",
                prompt: "O que significa a sigla 'HTTP' no contexto da web?",
                options: [
                    "A) HyperText Transfer Protocol",
                    "B) High Technical Transfer Process",
                    "C) Hyperlink Text Tools Program",
                    "D) Hard Traffic Thread Protocol"
                ],
                answer: "A) HyperText Transfer Protocol"
            },
            {
                id: 3,
                category: "Tecnologia",
                prompt: "Qual é o propósito principal de um banco de dados?",
                options: [
                    "A) Armazenar e recuperar dados de forma eficiente",
                    "B) Compilar código em linguagem de máquina",
                    "C) Criar interfaces gráficas",
                    "D) Gerenciar sistemas operacionais"
                ],
                answer: "A) Armazenar e recuperar dados de forma eficiente"
            },
            {
                id: 4,
                category: "Medicina",
                prompt: "Qual órgão do corpo humano é o principal responsável por filtrar o sangue e produzir a urina?",
                options: ["A) Fígado", "B) Rins", "C) Pâncreas", "D) Pulmão"],
                answer: "B) Rins"
            },
            {
                id: 5,
                category: "Medicina",
                prompt: "Como é chamada a pressão arterial quando os valores medidos estão consistentemente elevados?",
                options: ["A) Arritmia", "B) Hipoglicemia", "C) Hipertensão", "D) Anemia"],
                answer: "C) Hipertensão"
            },
            {
                id: 6,
                category: "Medicina",
                prompt: "Qual é a função principal do sistema imunológico?",
                options: [
                    "A) Transportar oxigênio pelo corpo",
                    "B) Defender o corpo contra infecções e doenças",
                    "C) Digerir alimentos",
                    "D) Controlar a temperatura corporal"
                ],
                answer: "B) Defender o corpo contra infecções e doenças"
            },
            {
                id: 7,
                category: "Tecnologia & Medicina",
                prompt: "Qual tecnologia permite a realização de cirurgias de alta precisão operadas remotamente por médicos?",
                options: [
                    "A) Impressão 3D de órgãos",
                    "B) Cirurgia Robótica",
                    "C) Sequenciamento Genético",
                    "D) Eletrocardiograma Digital"
                ],
                answer: "B) Cirurgia Robótica"
            },
            {
                id: 8,
                category: "Tecnologia & Medicina",
                prompt: "O que é telemedicina?",
                options: [
                    "A) Cirurgia tradicional em hospital",
                    "B) Prestação de serviços de saúde à distância usando tecnologia",
                    "C) Medicamentos eletrônicos",
                    "D) Máquinas de ressonância magnética"
                ],
                answer: "B) Prestação de serviços de saúde à distância usando tecnologia"
            }
        ];

        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedAnswer = null;
        let answered = false;

        function startQuiz() {
            questions = questionsData;
            document.querySelector('.start-screen').classList.add('hidden');
            document.querySelector('.quiz-container').classList.add('active');
            currentQuestionIndex = 0;
            score = 0;
            selectedAnswer = null;
            answered = false;
            displayQuestion();
        }

        function displayQuestion() {
            if (currentQuestionIndex >= questions.length) {
                showResults();
                return;
            }

            const question = questions[currentQuestionIndex];
            const progress = ((currentQuestionIndex) / questions.length) * 100;
            
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            document.getElementById('totalQuestions').textContent = questions.length;
            document.getElementById('questionText').textContent = question.prompt;
            document.getElementById('categoryBadge').textContent = question.category;

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            question.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.textContent = option;
                optionDiv.onclick = () => selectAnswer(option, optionDiv);
                optionsContainer.appendChild(optionDiv);
            });

            document.getElementById('feedback').classList.remove('show');
            document.getElementById('nextButton').disabled = true;
            selectedAnswer = null;
            answered = false;
        }

        function selectAnswer(answer, element) {
            if (answered) return;

            selectedAnswer = answer;
            
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });
            
            element.classList.add('selected');
            checkAnswer();
        }

        function checkAnswer() {
            if (!selectedAnswer) return;

            const question = questions[currentQuestionIndex];
            answered = true;

            const options = document.querySelectorAll('.option');
            options.forEach(opt => {
                if (opt.textContent === question.answer) {
                    opt.classList.add('correct');
                }
                if (opt.textContent === selectedAnswer && selectedAnswer !== question.answer) {
                    opt.classList.add('incorrect');
                }
                opt.onclick = null;
            });

            const feedback = document.getElementById('feedback');
            if (selectedAnswer === question.answer) {
                feedback.textContent = '✨ Resposta correta!';
                feedback.classList.remove('incorrect');
                feedback.classList.add('correct', 'show');
                score++;
            } else {
                feedback.textContent = `❌ Incorreto! A resposta correta era: ${question.answer}`;
                feedback.classList.remove('correct');
                feedback.classList.add('incorrect', 'show');
            }

            document.getElementById('nextButton').disabled = false;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            displayQuestion();
        }

        function showResults() {
            document.querySelector('.quiz-container').classList.remove('active');
            document.querySelector('.results-container').classList.add('active');

            const percentage = Math.round((score / questions.length) * 100);
            
            document.getElementById('scoreNumber').textContent = score;
            document.getElementById('totalScore').textContent = questions.length;
            document.getElementById('percentage').textContent = percentage;

            const resultMessage = document.getElementById('resultMessage');
            
            if (percentage === 100) {
                resultMessage.textContent = '🏆 Excelente! Desempenho perfeito!';
                resultMessage.className = 'result-message excellent';
            } else if (percentage >= 80) {
                resultMessage.textContent = '⭐ Muito bem! Excelente nível de conhecimento.';
                resultMessage.className = 'result-message good';
            } else if (percentage >= 60) {
                resultMessage.textContent = '👍 Bom! Você tem um bom conhecimento.';
                resultMessage.className = 'result-message good';
            } else {
                resultMessage.textContent = '📚 Vale a pena revisar alguns conceitos e tentar novamente!';
                resultMessage.className = 'result-message review';
            }

            localStorage.setItem('lastResult', JSON.stringify({
                score: score,
                total: questions.length,
                percentage: percentage,
                timestamp: new Date().toISOString()
            }));
        }

        function restartQuiz() {
            document.querySelector('.results-container').classList.remove('active');
            document.querySelector('.start-screen').classList.remove('hidden');
            currentQuestionIndex = 0;
            score = 0;
            selectedAnswer = null;
            answered = false;
        }
    </script>
</body>
</html>
